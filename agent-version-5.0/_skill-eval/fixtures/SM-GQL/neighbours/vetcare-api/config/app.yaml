# Конфиг vetcare-api. Имена очередей, расписания задач и границы прогонов лежат здесь;
# код читает значения отсюда и своих значений не содержит.
http:
  # Единственный маршрут GraphQL. Всё, что умеет сервис, приходит сюда одним POST;
  # операции объявлены в src/api/schema.py.
  graphql_path: /graphql
  playground: false

amqp:
  url: ${VETCARE_AMQP_URL}
  producers:
    vaccinationRecorded:
      routing_key: vet.vaccination.recorded
  consumers:
    ownerMerged:
      queue: vetcare.crm.owner-merged
      routing_key: crm.owner.merged
      prefetch: 20
      auto_ack: false

jobs:
  purgeCancelledAppointments:
    cron: "0 4 * * *"
    batch_size: 500
    retention_days: 180

db:
  url: ${VETCARE_DB_URL}
  # Токен интеграции с лабораторией: значение живёт в переменной окружения, не здесь.
  lab_token_env: VETCARE_LAB_TOKEN
