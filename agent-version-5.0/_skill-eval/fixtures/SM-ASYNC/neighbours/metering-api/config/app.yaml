# Конфиг metering-api. Имена топиков, группы консьюмеров и расписания лежат здесь;
# код читает значения отсюда и своих значений не содержит.
kafka:
  brokers: ${KAFKA_BROKERS}
  producers:
    readingAccepted:
      topic: metering.reading.accepted
      partitionKey: accountId
    readingRejected:
      topic: metering.reading.rejected
      partitionKey: accountId
    accountClosed:
      topic: metering.account.closed
      partitionKey: accountId
  consumers:
    invoices:
      topic: billing.invoice.issued
      group: metering-billing
      autoCommit: false
    crm:
      topic: crm.account.renamed
      group: metering-crm
      autoCommit: true
      retries: 3
jobs:
  estimateMissingReadings:
    cron: "0 2 1 * *"
    batchSize: 1000
  closeStaleAccounts:
    cron: "30 3 * * *"
  # syncMeterCatalog расписания здесь НЕ имеет: задачу дёргает внешний планировщик,
  # его манифест лежит в инфраструктурной репе, в этот репозиторий не входит.
db:
  url: ${METERING_DB_URL}
