# Слепок соседних сервисов. Этот файл ведёт человек.
# Куски монолита `rentalcore` дописаны скиллом `repo-split`.
# В манифесте намеренно обе формы `path`: с запятой и без — старая форма обязана остаться рабочей.
services:
  - name: rental-orders
    path: ../rentalcore/src/modules/orders, ../rentalcore/src/modules/pricing
    type: backend
    notes: |
      Разрез монолита черновой, карточки могут быть неполны по секциям.

  - name: rental-fleet
    path: ../rentalcore/src/modules/fleet
    type: backend

  - name: rental-common
    path: ../rentalcore/src/modules/common
    type: backend
