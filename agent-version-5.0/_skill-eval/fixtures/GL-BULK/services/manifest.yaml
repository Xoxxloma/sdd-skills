services:
  - name: auth
    path: ../auth-service
    type: backend
    notes: |
      Канонический владелец сессий. Легаси /v1/session не использовать.
  - name: geo
    path: ../geo-service
    type: backend
  - name: incident-web
    path: ../incident-web
    type: frontend
  - name: dispatch
    path: ../dispatch-service
    type: backend
  - name: support
    path: ../support-service
    type: backend
  - name: procurement
    path: ../procurement-service
    type: backend
  - name: notify
    path: ../notify-service
    type: backend
  - name: catalog
    path: ../catalog-service
    type: backend
  - name: ui-kit
    path: ../ui-kit
    type: lib
  - name: report-worker
    path: ../report-worker
    type: backend

glossary:
  - term: Session
    say: сессия сотрудника
    avoid: сеанс, вход
  - term: ЧОП
    say: частное охранное предприятие
  - term: ГБР
    say: группа быстрого реагирования
  - term: PatrolUnit
    say: патрульный экипаж
