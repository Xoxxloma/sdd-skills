# services/manifest.yaml — единственный файл слепка, который ведёт ЧЕЛОВЕК.
# service-map создаёт его при первом сборе; дальше только дописывает в конец строку про новую
# соседнюю репу — с подтверждения человека.
# archive-spec его не трогает вообще.
#
# Зачем он нужен: рядом со спек-репой может лежать сорок папок, а этой репе интересны
# двенадцать. Манифест — отбор, а не инвентарь соседнего каталога.

# ============================================================================
# ЧАСТЬ 1 — ФОРМА, КОТОРУЮ ПИШЕТ service-map. Копируй ровно её.
# ============================================================================
# Три поля на сервис: name, path, type. И всё.
# Поля `notes` здесь НЕТ и быть не должно — см. часть 2.

# Пути относительно КОРНЯ СПЕК-РЕПЫ, а не абсолютные: слепок открывается на разных машинах
# (ноутбук аналитика и чужой клон дадут разные абсолютные пути).
# Отдельного поля с корнем нет — каждый путь несёт свой `../` и читается сам по себе.

services:
  - name: telescope-api         # короткое имя; оно же имя файла карточки services/telescope-api.md
    path: ../telescope-api      # папка сервиса относительно корня спек-репы
    type: backend               # backend | frontend | fullstack | lib

  - name: dome-control
    path: ../dome-control
    type: backend

  - name: observer-web
    path: ../observer-portal
    type: frontend

  - name: sky-ui
    path: ../sky-ui
    type: lib

# ----------------------------------------------------------------------------
# КУСОК БОЛЬШОЙ РЕПЫ. `path` — та же СТРОКА, но путей в ней может быть несколько ЧЕРЕЗ ЗАПЯТУЮ.
# Такие строки появляются, когда репа не берётся одним сканом и её описывают по частям.
# Читается это одним правилом на все случаи: разбей `path` по запятой. У обычного сервиса
# запятой нет — получается один путь, то есть ровно прежнее поведение.
# ----------------------------------------------------------------------------
#
#   - name: skydesk-catalog         # одна строка = одна карточка = один субагент
#     path: ../skydesk/src/modules/telescopes, ../skydesk/src/modules/filters
#     type: backend
#
# Несколько папок — это ОДИН сервис, разложенный по пакетам, а не несколько сервисов.
# Общие папки репы (common, exceptions, config) сюда не кладутся: ключи из них размазали бы
# чужие эндпоинты по этой карточке.

# Рядом появилась новая репа — строка про неё дописывается СЮДА, в конец списка.
# Это делает либо человек своим редактором, либо service-map: на каждом прогоне он сверяет
# соседний каталог с этими путями и спрашивает про папки, которых здесь нет.
# В обоих случаях только добавление: существующие строки и notes при этом не трогаются.

# ============================================================================
# ЧАСТЬ 2 — ЧТО ДОПИСЫВАЕТ ЧЕЛОВЕК ПОЗЖЕ. service-map это НЕ пишет и НЕ затирает.
# ============================================================================
# Поле `notes` — единственное место во всём слепке, куда пишет человек. Туда идёт знание,
# которого нет в коде: кто канонический владелец сущности, какой эндпоинт не использовать,
# о чём договорились команды.
#
# Машина его не заполняет никогда — ни при создании манифеста, ни потом. Обоснование типа
# («определено по go.mod») в `notes` не идёт: тип уже записан в поле `type`, а занятая
# машиной строка потом читается человеком как чужая и мешает ему писать своё.
#
# Так это выглядит ПОСЛЕ того, как человек дописал notes — для понимания, не для копирования:
#
#   - name: telescope-api
#     path: ../telescope-api
#     type: backend
#     notes: |
#       Канонический владелец расписания ночей.
#       Легаси-эндпоинт /api/v1/slots не использовать, оставлен для старого настольного клиента.
