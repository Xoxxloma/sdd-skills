# NB-CHAIN-3 — один факт меняется три раза, потом выгрузка. Стадии для run-chain.sh, файлы — от папки фикстуры.
# Конец стадии — по содержимому notes/: пометка на пункте прошлой стадии (в засеве стадии её ещё нет); у стадии 1 — и
# любое «вместо:». Номер не тот — конец не ловится, диалог идёт до потолка: это красное оценщика, не стенда.
# Без скобок с `‖` и кириллицей: grep вне UTF-8 читает скобки побайтно, а `—` делит байты с `‖`.
STAGES=4

S1_SKILL=analyst-notebook
S1_PROMPT=stage-1-prompt.txt
S1_TURN2=turn2.txt
S1_CAP=5
S1_DONE_GREP='№1\.2 ?‖ ?замен(е|ё)н|вместо:'

S2_SKILL=analyst-notebook
S2_PROMPT=stage-2-prompt.txt
S2_TURN2=turn2.txt
S2_CAP=5
S2_DONE_GREP='№1\.1 ?‖ ?замен(е|ё)н'

S3_SKILL=analyst-notebook
S3_PROMPT=stage-3-prompt.txt
S3_TURN2=turn2.txt
S3_CAP=5
S3_DONE_GREP='№2\.1 ?‖ ?замен(е|ё)н'

S4_SKILL=analyst-notebook
S4_PROMPT=stage-4-prompt.txt
S4_TURN2=turn2-export.txt
S4_CAP=3
S4_DONE_RE='/notes/[^/]+/notebook-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9](-2)?\.points\.md$'
