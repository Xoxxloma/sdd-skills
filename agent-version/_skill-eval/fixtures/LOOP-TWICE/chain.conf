# LOOP-TWICE — стадии для run-chain.sh. Файлы — от папки фикстуры, глобы VAR_ — от корня песочницы.
STAGES=5

S1_SKILL=meeting-recall
S1_PROMPT=stage-1-prompt.txt
S1_TWIN=stage-1-twin-card.md
S1_TWIN_PROMPT=twin-analyst.md
S1_CAP=24
S1_DONE_RE='/docs/(.*/)?meeting-[^/]*\.points\.md$'

S2_SKILL=meeting-intake
S2_PROMPT=stage-2-prompt.txt
S2_TURN2=stage-2-turn2.txt
# Папка, которую раннер копирует в засев стадии поверх выхода прошлой: расшифровка приходит после протокола.
S2_ADD=stage-2-add
S2_CAP=20
# Список протокола `meeting-2026-10-15.points.md` уже лежит — конец только по новому имени с суффиксом.
S2_DONE_RE='/docs/(.*/)?meeting-2026-10-15([^./][^/]*\.points\.md|\.points-[^/]*\.md)$'

S3_SKILL=analyst-notebook
S3_PROMPT=stage-3-prompt.txt
S3_TURN2=stage-3-turn2.txt
S3_CAP=5
S3_DONE_RE='/notes/[^/]+/notebook\.md$'

S4_SKILL=analyst-notebook
S4_PROMPT=stage-4-prompt.txt
S4_TURN2=stage-4-turn2.txt
S4_CAP=5
# Не S4_DONE_VAR: путь списка встречи уже стоит в её разборе (`> Список:`).
S4_DONE_GREP='^> исходник:.*meeting-2026-10-15[^./][^/ ]*\.points\.md|^### 2 · встреча'

S5_SKILL=analyst-notebook
S5_PROMPT=stage-5-prompt.txt
S5_TURN2=stage-5-turn2.txt
S5_CAP=3
S5_DONE_RE='/notes/[^/]+/notebook-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9](-2)?\.points\.md$'

VAR_RECALL_POINTS='docs/*/meeting-2026-10-15.points.md'
VAR_MEETING_POINTS='docs/*/meeting-2026-10-15[!.]*.points.md'
