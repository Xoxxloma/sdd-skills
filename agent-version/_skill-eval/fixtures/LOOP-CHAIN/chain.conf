# LOOP-CHAIN — стадии для run-chain.sh. Файлы — от папки фикстуры, глобы VAR_ — от корня песочницы.
STAGES=4

S1_SKILL=meeting-intake
S1_PROMPT=stage-1-prompt.txt
S1_TURN2=stage-1-turn2.txt
S1_CAP=20
S1_DONE_RE='/docs/(.*/)?meeting-2026-10-14[^/]*\.points[^/]*\.md$'

S2_SKILL=analyst-notebook
S2_PROMPT=stage-2-prompt.txt
S2_TWIN=stage-2-twin-card.md
S2_TWIN_PROMPT=twin-objector.md
S2_CAP=5
# Не S2_DONE_VAR=POINTS: путь списка уже стоит в разборе стадии 1 (строка `> Список:`) — конец сработал бы до записи
# ноута. `> исходник:` строчными пишет только ноут; у списка и разбора — `> Источник:`.
S2_DONE_GREP='^> исходник:.*meeting-2026-10-14[^/ ]*\.points\.md|^### [0-9]+ · [Вв]стреча'

S3_SKILL=analyst-notebook
S3_PROMPT=stage-3-prompt.txt
S3_TURN2=stage-3-turn2.txt
S3_CAP=3
S3_DONE_RE='/notes/[^/]+/notebook-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9](-2)?\.points\.md$'

S4_SKILL=notes-to-intent
S4_PROMPT=stage-4-prompt.txt
S4_TWIN=stage-4-twin-card.md
S4_TWIN_PROMPT=twin-objector.md
S4_CAP=10
S4_DONE_RE='/docs/(.*/)?notebook-[^/]*-(bt|spec)\.md$'

VAR_POINTS='docs/*/meeting-2026-10-14*.points.md'
VAR_LIST='notes/заявки-на-ремонт-в-общежитии/notebook-*.points.md'
